server.port=${PORT:8081}
spring.application.name=knowledge-service

# PostgreSQL (Neon)
# Value comes from SPRING_DATASOURCE_URL env var on Render
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP  keep low for free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
# update = creates tables if missing, adds columns  safe for first deploy
# change to validate after first deploy confirms tables exist
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka (Upstash add later)
# Commented out for now deploy without Kafka first
# spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Redis (Upstash  add later)
# Commented out for now eploy without Redis first
# spring.data.redis.url=${REDIS_URL}
# spring.cache.type=none

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.devknowledge=INFO
logging.level.org.springframework.kafka=WARN



#Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable Redis as cache provider
spring.cache.type=redis

# Show cache activity in logs (dev only)
#logging.level.org.springframework.cache=TRACE